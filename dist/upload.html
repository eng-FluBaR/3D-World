<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D World - Качване на файл</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script type="module" crossorigin src="/assets/upload-DpONZj9Q.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/main-JsU89MZi.js">
    <link rel="stylesheet" crossorigin href="/assets/main-DM8neo9P.css">
  </head>
  <body data-page="upload">
    <div id="app-nav"></div>
    <main class="flex-grow-1">
      <div class="container py-5">
        <div class="page-hero mb-5">
          <h1>Качване на 3D модел 📤</h1>
          <p>Качете вашия 3D модел или векторно изображение за печат</p>
        </div>

        <form class="card shadow" id="upload-form">
          <div class="card-body">
            <div class="mb-4">
              <label class="form-label fw-semibold" for="model-file">3D Модел или Векторно Изображение</label>
              <input
                class="form-control"
                type="file"
                id="model-file"
                accept=".stl,.obj,.svg"
                required
              />
              <div class="form-text">Поддържани формати: .stl, .obj, .svg (векторни изображения)</div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold" for="material">Материал</label>
              <select class="form-select" id="material" required>
                <option value="" selected disabled>Изберете материал</option>
                <option value="PLA">PLA - Полилактид (стандартен)</option>
                <option value="PETG">PETG - Издръжлив и гъвкав</option>
                <option value="ABS">ABS - Висока якост</option>
              </select>
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold" for="quantity">Количество</label>
              <input class="form-control" type="number" id="quantity" min="1" value="1" required />
              <div class="form-text">Брой копия за печат</div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold" for="notes">Бележки (незадължително)</label>
              <textarea class="form-control" id="notes" rows="4" placeholder="Добавете специални изисквания, цвят, размер или други детайли..."></textarea>
            </div>

            <div class="alert alert-danger d-none" role="alert" id="upload-error"></div>
            <div class="alert alert-success d-none" role="alert" id="upload-success"></div>

            <button class="btn btn-primary btn-lg w-100" type="submit" id="upload-submit">
              Изпрати заявка
            </button>
          </div>
        </form>
      </div>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
