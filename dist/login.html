<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D World - Вход</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script type="module" crossorigin src="/assets/login-CXmqBH1e.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/main-lr9U21oM.js">
    <link rel="stylesheet" crossorigin href="/assets/main-7UdHJX8k.css">
  </head>
  <body data-page="login">
    <div id="app-nav"></div>
    <main class="flex-grow-1">
      <div class="container py-5">
        <div class="row justify-content-center">
          <div class="col-md-6 col-lg-5">
            <div class="page-hero mb-4">
              <h1>Вход 🔑</h1>
              <p>Влезте в акаунта си</p>
            </div>
            <form class="card shadow" id="login-form">
              <div class="card-body">
                <div class="mb-4">
                  <label class="form-label fw-semibold" for="email">Имейл адрес</label>
                  <input class="form-control" type="email" id="email" placeholder="ivan@example.com" required />
                </div>
                <div class="mb-4">
                  <label class="form-label fw-semibold" for="password">Парола</label>
                  <input class="form-control" type="password" id="password" placeholder="Въведете паролата си" required />
                </div>
                <div class="alert alert-danger d-none" role="alert" id="login-error"></div>
                <button class="btn btn-primary btn-lg w-100" type="submit" id="login-submit">Влез</button>
                <p class="mt-3 mb-0 text-center text-muted">
                  Нямате акаунт? <a href="/register.html">Регистрирайте се тук</a>
                </p>
              </div>
            </form>
        </div>
      </div>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
