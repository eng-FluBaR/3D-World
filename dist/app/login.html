<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D World - Вход</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script type="module" crossorigin src="/assets/login-B4k2u8Ev.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/main-CFGABBIZ.js">
    <link rel="stylesheet" crossorigin href="/assets/main-Do6EuTP6.css">
  </head>
  <body data-page="login">
    <div id="app-nav"></div>
    <main class="flex-grow-1">
      <div class="container py-5">
        <div class="row justify-content-center">
          <div class="col-12 col-lg-10">
            <div class="row g-4 align-items-stretch">
              <div class="col-lg-7">
                <div class="page-hero mb-4">
                  <h1>Вход 🔑</h1>
                  <p>Влезте в акаунта си</p>
                </div>
                <form class="card shadow h-100" id="login-form">
                  <div class="card-body">
                    <div class="mb-4">
                      <label class="form-label fw-semibold" for="email">Имейл адрес</label>
                      <input class="form-control" type="email" id="email" placeholder="ivan@example.com" required />
                    </div>
                    <div class="mb-4">
                      <label class="form-label fw-semibold" for="password">Парола</label>
                      <input class="form-control" type="password" id="password" placeholder="Въведете паролата си" required />
                    </div>
                    <div class="alert alert-danger d-none" role="alert" id="login-error"></div>
                    <button class="btn btn-primary btn-lg w-100" type="submit" id="login-submit">Влез</button>
                    <p class="mt-3 mb-0 text-center text-muted">
                      Нямате акаунт? <a href="/app/register.html">Регистрирайте се тук</a>
                    </p>
                  </div>
                </form>
              </div>

              <div class="col-lg-5">
                <aside class="card shadow h-100">
                  <div class="card-body">
                    <h5 class="card-title mb-3">Тестови акаунти</h5>
                    <div class="mb-3">
                      <div class="fw-semibold">admin@3dworld.bg</div>
                      <div class="text-muted">Статус: Админ</div>
                    </div>
                    <div class="mb-3">
                      <div class="fw-semibold">moderator@3dworld.bg</div>
                      <div class="text-muted">Статус: Модератор</div>
                    </div>
                    <div class="alert alert-info mb-0" role="note">Паролата е 123456</div>
                  </div>
                </aside>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
