<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D World - Профил</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script type="module" crossorigin src="/assets/profile-BIYomyRi.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/main-fDHe_LO-.js">
    <link rel="stylesheet" crossorigin href="/assets/main-CBPyR1Z7.css">
  </head>
  <body data-page="profile">
    <div id="app-nav"></div>
    <main class="flex-grow-1">
      <div class="container py-5">
        <div class="page-hero mb-4">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div>
              <h1 class="mb-2">Настройки на профила 👤</h1>
              <p>Управлявайте личните си данни</p>
            </div>
            <button class="btn btn-outline-light" id="logout-button" type="button">Изход</button>
          </div>
        </div>

        <form class="card shadow" id="profile-form">
          <div class="card-body">
            <div class="mb-4">
              <label class="form-label fw-semibold" for="email">Имейл адрес</label>
              <input class="form-control" type="email" id="email" disabled />
              <div class="form-text">Имейлът не може да бъде променян</div>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold" for="displayName">Име за показване</label>
              <input class="form-control" type="text" id="displayName" placeholder="Иван Иванов" />
              <div class="form-text">Това име ще се вижда в навигацията</div>
            </div>
            <div class="alert alert-danger d-none" role="alert" id="profile-error"></div>
            <div class="alert alert-success d-none" role="alert" id="profile-success"></div>
            <button class="btn btn-primary btn-lg w-100" type="submit" id="profile-submit">Запази промените</button>
          </div>
        </form>

        <div class="row g-4 mt-1">
          <div class="col-lg-6">
            <div class="card shadow h-100">
              <div class="card-body">
                <h5 class="card-title mb-3">Бързи действия</h5>
                <p class="text-muted mb-4">Функциите от панела са достъпни директно тук.</p>
                <div class="d-grid gap-2">
                  <a class="btn btn-outline-primary" href="/app/upload.html">Качване на проект</a>
                  <a class="btn btn-outline-secondary" href="/app/requests.html">Преглед на заявките</a>
                </div>
              </div>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="card shadow h-100">
              <div class="card-body">
                <h5 class="card-title mb-3">Статистика на проектите</h5>
                <div class="row g-3">
                  <div class="col-6">
                    <div class="border rounded-4 p-3 h-100">
                      <div class="text-muted small">Качени проекти</div>
                      <div class="h3 mb-0" id="stat-total-projects">0</div>
                    </div>
                  </div>
                  <div class="col-6">
                    <div class="border rounded-4 p-3 h-100">
                      <div class="text-muted small">Готови проекти</div>
                      <div class="h3 mb-0 text-success" id="stat-completed-projects">0</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
