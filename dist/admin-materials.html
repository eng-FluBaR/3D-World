<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D World - Админ Материали</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script type="module" crossorigin src="/assets/adminMaterials-DFn-F7nQ.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/main-CE7TNLLL.js">
    <link rel="stylesheet" crossorigin href="/assets/main-DM8neo9P.css">
  </head>
  <body data-page="admin-materials">
    <div id="app-nav"></div>

    <main class="container py-5 flex-grow-1">
      <h1 class="h3 mb-4">Manage Materials</h1>

      <div class="row g-4 mb-5">
        <div class="col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body">
              <h6 class="card-title">Add New Material</h6>
              <form id="add-material-form">
                <div class="mb-3">
                  <label class="form-label" for="material-name">Material Name</label>
                  <input class="form-control" type="text" id="material-name" required />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="material-price">Base Price (€)</label>
                  <input class="form-control" type="number" id="material-price" step="0.01" required />
                </div>
                <div class="alert alert-danger d-none" role="alert" id="form-error"></div>
                <div class="alert alert-success d-none" role="alert" id="form-success"></div>
                <button class="btn btn-primary w-100" type="submit" id="form-submit">Add Material</button>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-7">
          <div class="card shadow-sm">
            <div class="card-body">
              <h6 class="card-title">Materials List</h6>
              <div class="table-responsive">
                <table class="table align-middle mb-0">
                  <thead class="table-light">
                    <tr>
                      <th scope="col">Name</th>
                      <th scope="col">Base Price</th>
                      <th scope="col" class="text-end">Action</th>
                    </tr>
                  </thead>
                  <tbody id="materials-body">
                    <tr>
                      <td colspan="3" class="text-muted">Loading materials...</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="alert alert-danger d-none" role="alert" id="materials-error"></div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
