<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D World - Админ CMS</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script type="module" crossorigin src="/assets/adminCms--hfQCgUg.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/main-DS5gHuD4.js">
    <link rel="stylesheet" crossorigin href="/assets/main-DvnsEfwr.css">
  </head>
  <body data-page="admin-cms">
    <div id="app-nav"></div>

    <main class="container py-5 flex-grow-1">
      <h1 class="h3 mb-4">Content Management</h1>

      <div class="row g-4 justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow-sm">
            <div class="card-body">
              <div class="mb-4">
                <label class="form-label" for="page-select">Select Page</label>
                <select class="form-select" id="page-select">
                  <option value="">-- Choose a page --</option>
                  <option value="about">About</option>
                  <option value="how-it-works">How It Works</option>
                  <option value="printing">3D Printing</option>
                </select>
              </div>

              <form id="cms-form" class="d-none">
                <div class="mb-3">
                  <label class="form-label" for="page-title">Page Title</label>
                  <input class="form-control" type="text" id="page-title" required />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="page-content">Content</label>
                  <textarea class="form-control" id="page-content" rows="8" required></textarea>
                  <div class="form-text">Supports plain text and basic HTML.</div>
                </div>
                <div class="alert alert-danger d-none" role="alert" id="cms-error"></div>
                <div class="alert alert-success d-none" role="alert" id="cms-success"></div>
                <button class="btn btn-primary" type="submit" id="cms-submit">Save Changes</button>
                <a class="btn btn-outline-secondary ms-2" id="preview-link" href="#" target="_blank">Preview</a>
              </form>

              <div class="alert alert-info" id="cms-loading">
                Select a page to edit.
              </div>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="card shadow-sm bg-light">
            <div class="card-body">
              <h6 class="card-title">Pages Info</h6>
              <ul class="list-unstyled small text-muted">
                <li><strong>about</strong> - About page</li>
                <li><strong>how-it-works</strong> - How it works guide</li>
                <li><strong>printing</strong> - 3D printing info</li>
              </ul>
              <hr />
              <p class="small text-muted mb-0">
                Changes are saved to the database and displayed on your website.
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
