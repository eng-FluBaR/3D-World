<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D World - Админ Поръчки</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script type="module" crossorigin src="/assets/adminOrders-DXAsaFBb.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/main-DJOU-QkC.js">
    <link rel="stylesheet" crossorigin href="/assets/main-DakUOqwE.css">
  </head>
  <body data-page="admin-orders">
    <div id="app-nav"></div>

    <main class="container py-5 flex-grow-1">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-3 mb-lg-0">Manage Orders</h1>
        <div class="d-flex gap-2">
          <select class="form-select form-select-sm" id="status-filter" style="width: 150px;">
            <option value="">All Statuses</option>
            <option value="pending">Pending</option>
            <option value="quoted">Quoted</option>
            <option value="accepted">Accepted</option>
            <option value="rejected">Rejected</option>
            <option value="completed">Completed</option>
          </select>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <div id="orders-body" class="orders-grid">
            <div class="orders-empty text-muted">Loading orders...</div>
          </div>
        </div>
      </div>

      <div class="alert alert-danger d-none mt-3" role="alert" id="orders-error"></div>
    </main>

    <div class="modal fade" id="orderDetailsModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="order-modal-title">Поръчка</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="order-modal-body"></div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
