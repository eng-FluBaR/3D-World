<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D World - Галерия</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body data-page="gallery">
    <div id="app-nav"></div>

    <main class="flex-grow-1">
      <div class="container py-5">
        <div class="page-hero mb-5">
          <h1>Галерия на проекти 🎭</h1>
          <p>Производствени прототипи и готови изделия</p>
        </div>

        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
          <h2 class="mb-0">Наши реализации</h2>
          <span class="text-muted">Високо качество и вънимание към детайла</span>
        </div>
        <div class="row g-4" id="gallery-projects">
          <div class="col-12">
            <div class="alert alert-info mb-0">Зареждане на проектите...</div>
          </div>
        </div>
      </div>
    </main>

    <footer class="border-top py-4">
      <div class="container d-flex flex-wrap justify-content-between align-items-center">
        <span class="text-muted">Want to see more? Ask for our full portfolio.</span>
        <a class="text-decoration-none" href="/contacts.html">Request portfolio</a>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/pages/gallery.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
