<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D World - Home</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body data-page="index">
    <div id="app-nav"></div>
    <main class="container py-5">
      <div class="page-hero mb-4">
        <h1 class="display-6 mb-2">Welcome to 3D World</h1>
        <p class="mb-0">Multi-page Vite app with Vanilla JS + Supabase-ready structure.</p>
      </div>
      <div class="row g-3">
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title">Get Started</h5>
              <p class="card-text">Sign in or create an account to access your dashboard.</p>
              <a class="btn btn-primary" href="/login.html">Login</a>
              <a class="btn btn-outline-primary ms-2" href="/register.html">Register</a>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title">Upload Models</h5>
              <p class="card-text">Manage 3D assets and review requests in one place.</p>
              <a class="btn btn-secondary" href="/upload.html">Upload</a>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
