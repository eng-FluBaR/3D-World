<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D World - Admin Materials</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body data-page="admin-materials">
    <header class="border-bottom bg-dark">
      <nav class="navbar navbar-expand-lg navbar-dark container py-3">
        <a class="navbar-brand fw-semibold" href="/admin.html">3D Admin</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#adminNav"
          aria-controls="adminNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="adminNav">
          <ul class="navbar-nav ms-auto gap-lg-2 align-items-lg-center">
            <li class="nav-item"><a class="nav-link" href="/admin.html">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="/admin-orders.html">Orders</a></li>
            <li class="nav-item"><a class="nav-link" href="/admin-users.html">Users</a></li>
            <li class="nav-item"><a class="nav-link active" href="/admin-materials.html">Materials</a></li>
            <li class="nav-item"><a class="nav-link" href="/admin-cms.html">CMS</a></li>
            <li class="nav-item">
              <button class="btn btn-outline-light ms-lg-3" id="admin-logout" type="button">
                Logout
              </button>
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <main class="container py-5">
      <h1 class="h3 mb-4">Manage Materials</h1>

      <div class="row g-4 mb-5">
        <div class="col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body">
              <h6 class="card-title">Add New Material</h6>
              <form id="add-material-form">
                <div class="mb-3">
                  <label class="form-label" for="material-name">Material Name</label>
                  <input class="form-control" type="text" id="material-name" required />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="material-price">Base Price (€)</label>
                  <input class="form-control" type="number" id="material-price" step="0.01" required />
                </div>
                <div class="alert alert-danger d-none" role="alert" id="form-error"></div>
                <div class="alert alert-success d-none" role="alert" id="form-success"></div>
                <button class="btn btn-primary w-100" type="submit" id="form-submit">Add Material</button>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-7">
          <div class="card shadow-sm">
            <div class="card-body">
              <h6 class="card-title">Materials List</h6>
              <div class="table-responsive">
                <table class="table align-middle mb-0">
                  <thead class="table-light">
                    <tr>
                      <th scope="col">Name</th>
                      <th scope="col">Base Price</th>
                      <th scope="col" class="text-end">Action</th>
                    </tr>
                  </thead>
                  <tbody id="materials-body">
                    <tr>
                      <td colspan="3" class="text-muted">Loading materials...</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="alert alert-danger d-none" role="alert" id="materials-error"></div>
    </main>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/pages/admin-materials.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
