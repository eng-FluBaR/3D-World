<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D World - Профил</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body data-page="profile">
    <div id="app-nav"></div>
    <main class="flex-grow-1">
      <div class="container py-5">
        <div class="row g-4">
          <div class="col-lg-8">
            <div class="page-hero mb-4">
              <h1>Настройки на профила 👤</h1>
              <p>Управлявайте личните си данни</p>
            </div>
            <form class="card shadow" id="profile-form">
              <div class="card-body">
                <div class="mb-4">
                  <label class="form-label fw-semibold" for="email">Имейл адрес</label>
                  <input class="form-control" type="email" id="email" disabled />
                  <div class="form-text">Имейлът не може да бъде променян</div>
                </div>
                <div class="mb-4">
                  <label class="form-label fw-semibold" for="displayName">Име за показване</label>
                  <input class="form-control" type="text" id="displayName" placeholder="Иван Иванов" />
                  <div class="form-text">Това име ще се вижда в навигацията</div>
                </div>
                <div class="alert alert-danger d-none" role="alert" id="profile-error"></div>
                <div class="alert alert-success d-none" role="alert" id="profile-success"></div>
                <button class="btn btn-primary btn-lg w-100" type="submit" id="profile-submit">Запази промените</button>
              </div>
            </form>
          </div>
          <div class="col-lg-4">
            <div class="card shadow border-danger">
              <div class="card-body">
                <h5 class="card-title text-danger">Опасна зона ⚠️</h5>
                <p class="card-text text-muted mb-3">Излезте от акаунта си</p>
                <button class="btn btn-outline-danger w-100" id="logout-button" type="button">
                  Изход
                </button>
              </div>
            </div>
          </div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/pages/profile.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
