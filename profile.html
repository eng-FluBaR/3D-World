<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D World - Profile</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body data-page="profile">
    <div id="app-nav"></div>
    <main class="container py-5">
      <div class="row g-4">
        <div class="col-lg-8">
          <h1 class="h3 mb-4">Profile Settings</h1>
          <form class="card card-body shadow-sm" id="profile-form">
            <div class="mb-3">
              <label class="form-label" for="email">Email Address</label>
              <input class="form-control" type="email" id="email" disabled />
              <div class="form-text">Your email cannot be changed.</div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="displayName">Display Name</label>
              <input class="form-control" type="text" id="displayName" />
            </div>
            <div class="alert alert-danger d-none" role="alert" id="profile-error"></div>
            <div class="alert alert-success d-none" role="alert" id="profile-success"></div>
            <button class="btn btn-primary" type="submit" id="profile-submit">Save Changes</button>
          </form>
        </div>
        <div class="col-lg-4">
          <div class="card shadow-sm border-danger">
            <div class="card-body">
              <h6 class="card-title text-danger">Danger Zone</h6>
              <p class="card-text small text-muted mb-3">Sign out from your account.</p>
              <button class="btn btn-outline-danger w-100" id="logout-button" type="button">
                Logout
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/pages/profile.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
