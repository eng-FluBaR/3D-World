<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D World - Панел</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body data-page="dashboard">
    <div id="app-nav"></div>

    <main class="container py-5 flex-grow-1">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <div>
          <h1 class="h3 mb-1">Welcome back</h1>
          <p class="text-muted mb-0">Signed in as <span id="user-email">...</span></p>
        </div>
        <a class="btn btn-primary" href="/app/upload.html">Upload File</a>
      </div>
      <div class="row g-3">
        <div class="col-md-4">
          <div class="card shadow-sm">
            <div class="card-body">
              <h6 class="card-title">Upload Center</h6>
              <p class="card-text">Send a new model to production.</p>
              <a class="btn btn-outline-primary btn-sm" href="/app/upload.html">Upload File</a>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card shadow-sm">
            <div class="card-body">
              <h6 class="card-title">My Requests</h6>
              <p class="card-text">Track approvals and production stages.</p>
              <a class="btn btn-outline-secondary btn-sm" href="/app/requests.html">View Requests</a>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card shadow-sm">
            <div class="card-body">
              <h6 class="card-title">Profile</h6>
              <p class="card-text">Update contact info and preferences.</p>
              <a class="btn btn-outline-dark btn-sm" href="/app/profile.html">Edit Profile</a>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/pages/dashboard.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
