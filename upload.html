<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D World - Upload</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body data-page="upload">
    <div id="app-nav"></div>
    <main class="container py-5">
      <h1 class="h3 mb-4">Submit 3D Printing Request</h1>
      <form class="card card-body shadow-sm" id="upload-form">
        <div class="mb-3">
          <label class="form-label" for="model-file">STL or OBJ File</label>
          <input
            class="form-control"
            type="file"
            id="model-file"
            accept=".stl,.obj"
            required
          />
          <div class="form-text">Accepted formats: .stl, .obj</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="material">Material</label>
          <select class="form-select" id="material" required>
            <option value="" selected disabled>Select material</option>
            <option value="PLA">PLA</option>
            <option value="PETG">PETG</option>
            <option value="ABS">ABS</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label" for="quantity">Quantity</label>
          <input class="form-control" type="number" id="quantity" min="1" value="1" required />
        </div>
        <div class="mb-3">
          <label class="form-label" for="notes">Notes</label>
          <textarea class="form-control" id="notes" rows="3"></textarea>
        </div>
        <div class="alert alert-danger d-none" role="alert" id="upload-error"></div>
        <div class="alert alert-success d-none" role="alert" id="upload-success"></div>
        <button class="btn btn-primary" type="submit" id="upload-submit">Submit Request</button>
      </form>
    </main>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/pages/upload.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
