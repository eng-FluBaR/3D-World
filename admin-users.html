<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D World - Admin Users</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body data-page="admin-users">
    <header class="border-bottom bg-dark">
      <nav class="navbar navbar-expand-lg navbar-dark container py-3">
        <a class="navbar-brand fw-semibold" href="/admin.html">3D Admin</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#adminNav"
          aria-controls="adminNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="adminNav">
          <ul class="navbar-nav ms-auto gap-lg-2 align-items-lg-center">
            <li class="nav-item"><a class="nav-link" href="/admin.html">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="/admin-orders.html">Orders</a></li>
            <li class="nav-item"><a class="nav-link active" href="/admin-users.html">Users</a></li>
            <li class="nav-item"><a class="nav-link" href="/admin-materials.html">Materials</a></li>
            <li class="nav-item"><a class="nav-link" href="/admin-cms.html">CMS</a></li>
            <li class="nav-item">
              <button class="btn btn-outline-light ms-lg-3" id="admin-logout" type="button">
                Logout
              </button>
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <main class="container py-5">
      <h1 class="h3 mb-4">Manage Users</h1>

      <div class="card shadow-sm">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th scope="col">Email</th>
                  <th scope="col">Role</th>
                  <th scope="col">Status</th>
                  <th scope="col">Created</th>
                  <th scope="col" class="text-end">Action</th>
                </tr>
              </thead>
              <tbody id="users-body">
                <tr>
                  <td colspan="5" class="text-muted">Loading users...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="alert alert-danger d-none mt-3" role="alert" id="users-error"></div>
    </main>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/pages/admin-users.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
