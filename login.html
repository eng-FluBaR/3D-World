<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D World - Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body data-page="login">
    <div id="app-nav"></div>
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <h1 class="h3 mb-4">Login</h1>
          <form class="card card-body shadow-sm" id="login-form">
            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <input class="form-control" type="email" id="email" required />
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">Password</label>
              <input class="form-control" type="password" id="password" required />
            </div>
            <div class="alert alert-danger d-none" role="alert" id="login-error"></div>
            <button class="btn btn-primary" type="submit" id="login-submit">Sign In</button>
            <p class="mt-3 mb-0 text-muted">
              No account? <a href="/register.html">Register here</a>.
            </p>
          </form>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/pages/login.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
